name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Serve the app from the repository sub-path (build only, source files untouched)
        run: |
          sed -i 's|<BrowserRouter>|<BrowserRouter basename={process.env.PUBLIC_URL}>|' src/App.js
          find src -type f \( -name '*.js' -o -name '*.jsx' \) -print0 | xargs -0 sed -i -E 's#window\.location\.href *= *"/#window.location.href = process.env.PUBLIC_URL + "/#g'
      - run: npm run build
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
          PUBLIC_URL: /ClaraBernadou_P7_Frontend_28032022
      - name: Add the simulated API
        run: |
          cp demo/demo-api.js build/
          sed -i 's|</head>|<script src="/ClaraBernadou_P7_Frontend_28032022/demo-api.js"></script></head>|' build/index.html
          cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
